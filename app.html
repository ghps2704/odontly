
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odontly — ERP odontológico com IA</title>
    <meta name="description" content="Agenda, prontuário e financeiro com IA nativa. O sistema mais inteligente para clínicas odontológicas." />
    <meta name="theme-color" content="#0284c7" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0284c7',
              'primary-light': '#0ea5e9',
              'ice-blue': '#e0f2fe',
              'polar-white': '#f0f9ff',
              'deep-navy': '#0a0f1e',
              slate: {
                DEFAULT: '#64748b',
              },
              border: '#e0f2fe',
              'border-strong': '#bae6fd',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            borderRadius: {
              sm: '6px',
              DEFAULT: '8px',
              md: '10px',
              lg: '14px',
              xl: '20px',
            },
          },
        },
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

      :root {
        --color-primary: #0284c7;
        --color-primary-light: #0ea5e9;
        --color-bg: #f0f9ff;
        --color-bg-card: #ffffff;
        --color-bg-surface: #e0f2fe;
        --color-text-title: #0a0f1e;
        --color-text-body: #374151;
        --color-text-muted: #64748b;
        --color-border: #e0f2fe;
        --color-border-strong: #bae6fd;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --radius-xl: 20px;
      }

      html {
        font-family: 'Inter', sans-serif;
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text-body);
        -webkit-font-smoothing: antialiased;
      }

      /* Focus ring global */
      *:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
      }

      /* Scrollbar subtle */
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #bae6fd; border-radius: 99px; }

      /* ── Landing page styles ── */
      .lp-gradient-text {
        background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 50%, #38bdf8 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      }
      .lp-hero-bg {
        background: radial-gradient(ellipse 80% 60% at 50% -10%, #e0f2fe 0%, #f0f9ff 55%, #ffffff 100%);
      }
      @keyframes lp-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      .lp-float { animation: lp-float 4s ease-in-out infinite; }
      @keyframes lp-pulse-dot { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.6; transform:scale(1.15); } }
      .lp-pulse { animation: lp-pulse-dot 2s ease-in-out infinite; }
      .lp-reveal { opacity: 0; transform: translateY(24px); transition: opacity .6s ease, transform .6s ease; }
      .lp-reveal.lp-visible { opacity: 1; transform: translateY(0); }
      @keyframes lp-cta-pulse { 0% { box-shadow: 0 0 0 0 rgba(2,132,199,.4); } 70% { box-shadow: 0 0 0 14px rgba(2,132,199,0); } 100% { box-shadow: 0 0 0 0 rgba(2,132,199,0); } }
      .lp-cta-glow { animation: lp-cta-pulse 2.5s ease-out infinite; }
      .lp-dots { background-image: radial-gradient(circle, #bae6fd 1px, transparent 1px); background-size: 28px 28px; }
      @keyframes lp-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      .lp-urgency { background: linear-gradient(90deg,#0369a1 0%,#0284c7 50%,#0369a1 100%); background-size:200% 100%; animation: lp-shimmer 3s linear infinite; }
      .lp-card { transition: transform .2s ease, box-shadow .2s ease; }
      .lp-card:hover { transform: translateY(-4px); box-shadow: 0 20px 60px rgba(2,132,199,.12); }
      .lp-popular { box-shadow: 0 0 0 2px #0284c7, 0 24px 60px rgba(2,132,199,.18); }
      .lp-testimonial { transition: transform .2s ease; }
      .lp-testimonial:hover { transform: translateY(-3px); }
      .lp-faq-content { max-height: 0; overflow: hidden; transition: max-height .35s ease; }
      .lp-faq-content.lp-open { max-height: 300px; }
      .lp-nav-scrolled { backdrop-filter: blur(20px); background: rgba(255,255,255,.92) !important; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
